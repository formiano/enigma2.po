name: MakeMO

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create MO files
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get -q update
          sudo apt-get install -y gettext

          mkdir -p Rel

          for po in po/*.po; do
            lang="$(basename "$po" .po)"
            echo "Compilo $po -> Rel/$lang.mo"
            msgfmt -o "Rel/$lang.mo" "$po"
          done

      - name: Publish MO files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Rel
          force_orphan: true
